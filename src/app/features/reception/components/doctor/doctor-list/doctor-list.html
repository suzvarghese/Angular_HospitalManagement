<div class="container-fluid mt-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold text-dark mb-1">Doctors</h2>
            <p class="text-muted mb-0">Available doctors and their consultation fees</p>
        </div>
    </div>

    <div class="alert alert-danger" *ngIf="errorMessage()">{{ errorMessage() }}</div>

    <div class="text-center py-5" *ngIf="isLoading()">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>

    <div class="card" *ngIf="!isLoading()">
        <div class="table-responsive">
            <table class="table table-hover">
                <thead class="table-dark">
                    <tr>
                        <th>Doctor ID</th>
                        <th>Name</th>
                        <th>Specialization</th>
                        <th>Consultation Fee</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let doctor of doctors()">
                        <td>#{{ doctor.DoctorId }}</td>
                        <td class="fw-semibold">Dr. {{ doctor.DoctorName }}</td>
                        <td><span class="badge rc-spec-badge">{{ doctor.Specialization }}</span></td>
                        <td>₹ {{ doctor.ConsultationFee }}</td>
                    </tr>

                    <tr *ngIf="doctors().length === 0">
                        <td colspan="4" class="text-center text-muted py-4">
                            No doctors found.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>
