<div class="container mt-4">

<h2>Manage Lab Tests</h2>


<button
    class="btn btn-primary mb-3"
    routerLink="/lab/add-test">
    Add New Test
</button>

<div class="table-responsive">

<table class="table table-bordered table-striped">


<thead class="table-dark">

<tr>
<th>ID</th>
<th>Code</th>
<th>Name</th>
<th>Department</th>
<th>Category</th>
<th>Fee</th>
<th>Status</th>
<th>Action</th>
</tr>

</thead>


<tbody>

<tr *ngFor="let test of labTests()">

<td>{{test.testId}}</td>

<td>{{test.testCode}}</td>

<td>{{test.testName}}</td>

<td>{{test.department}}</td>

<td>{{test.category}}</td>

<td>₹{{test.baseFee}}</td>


<td>

<span *ngIf="test.isActive" class="active-status">
Active
</span>

<span *ngIf="!test.isActive" class="inactive-status">
Inactive
</span>

</td>


<td>

<button
    class="btn btn-warning btn-sm me-2"
    [routerLink]="['/lab/edit-test', test.testId]">
Edit
</button>


<button 
class="btn btn-danger btn-sm"
(click)="deleteTest(test.testId)">
Delete
</button>


</td>


</tr>

</tbody>


</table>

</div>

</div>
